# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{310, 311, 312}-{linux,macos,windows}
isolated_build=true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYTEST_QT_API
    PYVISTA_OFF_SCREEN
extras =
    dev
    tracking
# -W: napari's PublicOnlyProxy warns on private attribute access from plugin code, and
# napari will turn that into an AttributeError.
commands = pytest -v --color=yes -n auto --dist loadfile --cov=napari_deeplabcut --cov-report=xml -W "error:Private attribute access:FutureWarning"

[testenv:napari-floor]
# Keep this exact pin aligned with the napari lower bound in pyproject.toml.
commands_pre = pip install "napari==0.6.6"
commands = pytest -v --color=yes -n auto --dist loadfile

[testenv:napari-pre]
# Weekly early warning only - see .github/workflows/napari_breakage.yml. Nothing gates
# on this env, so it fails as early as possible. The private-attribute filter is the
# same one [testenv] now carries; what this env adds is running it against a napari
# prerelease, so newly *deprecated* internals surface during napari's RC window.
# It is repeated here because this env overrides commands rather than extending it.
commands_pre = pip install --pre --upgrade napari
commands = pytest -v --color=yes -n auto --dist loadfile -W "error:Private attribute access:FutureWarning"

[testenv:napari-pinned]
# Manual release checks: test a specified napari version across the full matrix.
# NAPARI_VERSION is a pip specifier, e.g. "napari==0.6.6" (lower bound) or "napari" (latest stable).
passenv =
    {[testenv]passenv}
    NAPARI_VERSION
commands_pre = pip install "{env:NAPARI_VERSION:napari}"
commands = pytest -v --color=yes -n auto --dist loadfile
